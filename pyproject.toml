[project]
name = "reisadvies-checker"
version = "0.1.0"
description = "Vergelijk de reisadviezen van gelijkgestemde landen met de Nederlandse kleurcodes."
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5", "Jinja2>=3.1", "Babel>=2.14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["reisadvies", "reisadvies.sources"]

[tool.setuptools.package-data]
reisadvies = ["templates/*.html", "static/fonts/*"]

[tool.ruff]
line-length = 110
